<body>
<div id="side">
  <h1>Анимации — каталог</h1>
  <input id="filter" placeholder="фильтр по имени клипа…">
  <div id="loadinfo">Загрузка каталога…</div>
  <div id="catalog"></div>
</div>
<div id="view">
  <canvas id="canvas"></canvas>
  <div id="hud">Клип: <code id="cname" title="клик — скопировать">—</code>
    <span class="path2">Путь: <code id="cpath" title="клик — скопировать">—</code></span></div>
  <div id="ctrl">
    <button id="pp">⏸ пауза</button>
    Скорость <input id="spd" type="range" min="0.25" max="2" step="0.25" value="1"> <span id="spdv">1×</span>
    <button id="rs" style="margin-left:8px">↺ камера</button>
  </div>
  <div id="tip">ЛКМ — вращать · колесо — зум · ПКМ — сдвиг<br>Клик по кандидату справа — выбрать пункт слева и открыть в центре</div>
</div>
<div id="right">
  <h2>Скиллы → кандидаты</h2>
  <div id="skills"><div style="color:#999;font-size:13px">Загрузка…</div></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '../tools/animation_catalog/lib/controls/OrbitControls.js';
import { GLTFLoader } from '../tools/animation_catalog/lib/loaders/GLTFLoader.js';
import { FBXLoader } from '../tools/animation_catalog/lib/loaders/FBXLoader.js';
import { buildAvatarClip, captureRest } from './anim_retarget.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202028);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.15));
const dl = new THREE.DirectionalLight(0xffffff, 2.0); dl.position.set(3,6,4); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x8899ff, 0.7); dl2.position.set(-4,3,-4); scene.add(dl2);
scene.add(new THREE.GridHelper(20, 20, 0x555566, 0x3a3a45));

const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const HOME = {pos: new THREE.Vector3(0, 1.4, 4.6), tgt: new THREE.Vector3(0, 0.95, 0)};
cam.position.copy(HOME.pos);
const ctl = new OrbitControls(cam, canvas);
ctl.target.copy(HOME.tgt);
ctl.enableDamping = true;

function resize(){
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = canvas.clientHeight || canvas.parentElement.clientHeight;
  if (w && h){ renderer.setSize(w, h, false); cam.aspect = w/h; cam.updateProjectionMatrix(); }
}
window.addEventListener('resize', resize);

let model = null, mixer = null, action = null, playing = true, speed = 1.0, loadTok = 0, curClip = null;
const gltfLoader = new GLTFLoader();
const fbxLoader = new FBXLoader();
const loadinfo = document.getElementById('loadinfo');
const cname = document.getElementById('cname');
const cpath = document.getElementById('cpath');
// registry: url -> {el, group} для связи «кандидат справа → пункт слева»
const byUrl = new Map();

// --- Приведение модели к сцене -------------------------------------------------
// ВАЖНО: renderer.render() каждый кадр обновляет и matrixWorld, и skeleton.boneMatrices.
// Если замерить Box3 сразу после load(), кости ещё «пустые»: SkinnedMesh.computeBoundingBox
// считает по boneInverses → бокс 0.43 м вместо 2.07 м, масштаб уезжает в 4.2× (гигант).
// Второй капкан: Box3.setFromObject(obj) по умолчанию берёт КЭШ SkinnedMesh.boundingBox,
// поэтому повторный замер видел тот же мусор. Ниже — syncSkeletons() + precise-бокс.
function syncSkeletons(root){
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isSkinnedMesh && o.skeleton) o.skeleton.update(); });
}
function skinnedBox(root){
  root.traverse(o => { if (o.isSkinnedMesh){ o.boundingBox = null; o.boundingSphere = null; } });
  return new THREE.Box3().setFromObject(root, true);
}
// Масштаб модели к 1.8 м + подошвы на пол + центр в XZ-нуле (Hips-трек не трогаем).
function normalizeModel(m){
  m.rotation.y = Math.PI;
  syncSkeletons(m);
  let box = skinnedBox(m);
  let size = new THREE.Vector3(); box.getSize(size);
  const cs = size.y > 0.001 ? size.y / 1.8 : 1;
  window.__charScale = cs;
  m.scale.setScalar(1 / cs);
  syncSkeletons(m);
  box = skinnedBox(m);
  box.getSize(size);
  m.position.y -= box.min.y;
  m.position.x -= (box.min.x + box.max.x) / 2;
  m.position.z -= (box.min.z + box.max.z) / 2;
  ctl.target.y = Math.max(size.y * 0.55, 0.8);
  window.__dbg = { sizeY:+size.y.toFixed(3), minY:+box.min.y.toFixed(3), cs:+cs.toFixed(4),
                   posY:+m.position.y.toFixed(3), tgtY:+ctl.target.y.toFixed(3) };
}

function clearModel(){
  if (model){ scene.remove(model); model = null; }
  // аватар тоже убираем из сцены при переходе на self-contained модель
  if (avatar){ scene.remove(avatar); avatar = null; avatarMixer = null; avatarRest = null; avatarClip = null; }
  mixer = null; action = null; curClip = null;
}

// Аватар для animation-only FBX (mixamo-lib/fbx — без меша, только клип).
// Грузим один раз, вешаем FBX-клип на его скелет (как старый candidates-вьюер).
const AVATAR_URL = '/Graphics/mixamo-lib/character_refined_glb/Knight_D_Pelegrini.glb';
let avatar = null, avatarMixer = null, avatarLoading = null, avatarRest = null, avatarClip = null;
function ensureAvatar(cb){
  if (avatar){ cb(); return; }
  if (avatarLoading){ avatarLoading.push(cb); return; }
  avatarLoading = [cb];
  gltfLoader.load(AVATAR_URL, (gltf) => {
    avatar = gltf.scene; scene.add(avatar); normalizeModel(avatar);
    // normalizeModel развернул аватар на PI (для GLB-кандидатов это верно),
    // но FBX-клип несёт свой поворот корня → двойной разворот = спина к камере.
    // Аватар используется ТОЛЬКО под FBX, поэтому снимаем PI.
    avatar.rotation.y = 0;
    avatarRest = captureRest(avatar);   // rest-позы костей аватара нужны ретаргету
    avatarMixer = new THREE.AnimationMixer(avatar);
    const cbs = avatarLoading; avatarLoading = null; cbs.forEach(f => f());
  }, undefined, () => { cname.textContent = 'ошибка загрузки аватара'; avatarLoading = null; });
}
// FBX — animation-only (меша нет): играем клип на аватаре. Сырые кватернионы FBX
// писать нельзя — rest-позы ригов разные (см. admin/anim_retarget.js).
function playOnAvatar(clip, label, srcRoot){
  if (action) action.stop();
  const rtClip = buildAvatarClip(clip, srcRoot, avatar, avatarRest);
  if (!rtClip){ cname.textContent = 'ретаргет не удался (кости не совпали)'; return; }
  if (avatarClip) avatarMixer.uncacheClip(avatarClip);
  avatarClip = rtClip;
  action = avatarMixer.clipAction(rtClip);
  action.reset().fadeIn(0.15).play();
  action.setEffectiveTimeScale(playing ? speed : 0);
  cname.textContent = label;
  curClip = rtClip;
  groundAnimatedPose(avatar, avatarMixer, action, rtClip);
}

function playClip(clip, label){
  if (!mixer || !clip) return;
  if (action) action.stop();
  action = mixer.clipAction(clip);
  action.reset().fadeIn(0.15).play();
  action.setEffectiveTimeScale(playing ? speed : 0);
  curClip = clip;
  cname.textContent = label || clip.name;
}

// Пол по РЕАЛЬНОЙ анимированной позе. bind-поза врёт (клип уводит корень ниже нуля),
// а fadeIn(0.15) при t=0 даёт вес 0 — поэтому прежний замер «видел» bind-позу и ничего
// не исправлял. Теперь: полный вес, прогон N кадров клипа, берём самую низкую точку.
function groundAnimatedPose(root, mx, act, clip){
  if (!root || !mx || !act || !clip) return;
  act.setEffectiveWeight(1);
  let minY = Infinity;
  const N = 8;
  for (let i = 0; i < N; i++){
    act.time = clip.duration * i / N;
    mx.update(0);
    syncSkeletons(root);
    const b = skinnedBox(root);
    if (!b.isEmpty() && isFinite(b.min.y)) minY = Math.min(minY, b.min.y);
  }
  if (isFinite(minY)) root.position.y -= minY;
  act.reset().fadeIn(0.15).play();
  act.setEffectiveTimeScale(playing ? speed : 0);
  if (window.__dbg) window.__dbg.groundY = +root.position.y.toFixed(3);
}

// загрузка пункта каталога по url. kind: glb | fbx | glblib | none
function loadUrl(url, name, kind, tok){
  cpath.textContent = url;
  if (kind === 'none'){ cname.textContent = 'нет браузер-превью (.f32)'; clearModel(); return; }
  cname.textContent = 'загрузка…';
  const fail = () => { if (tok === loadTok) cname.textContent = 'ошибка загрузки'; };
  if (kind === 'fbx'){
    fbxLoader.load(url, (fbx) => {
      if (tok !== loadTok) return;
      const clip = fbx.animations && fbx.animations[0];
      if (!clip){ cname.textContent = 'В FBX НЕТ АНИМАЦИИ'; return; }
      // есть ли меш? Box3 по сцене. Пусто → animation-only FBX → аватар.
      let box = new THREE.Box3().setFromObject(fbx);
      const hasMesh = !box.isEmpty();
      if (hasMesh){
        clearModel();
        model = fbx; scene.add(model); normalizeModel(model);
        mixer = new THREE.AnimationMixer(model);
        playClip(clip, name);
        groundAnimatedPose(model, mixer, action, curClip);
      } else {
        // прячем прежнюю модель, грузим аватар и вешаем клип (с ретаргетом)
        if (model){ scene.remove(model); model = null; }
        mixer = null; action = null;
        ensureAvatar(() => { if (tok === loadTok) playOnAvatar(clip, name + '  (на аватаре)', fbx); });
      }
    }, undefined, fail);
    return;
  }
  // glb / glblib: GLB = меш + анимация(и) в одном файле
  gltfLoader.load(url, (gltf) => {
    if (tok !== loadTok) return;
    clearModel();
    model = gltf.scene; scene.add(model); normalizeModel(model);
    mixer = new THREE.AnimationMixer(model);
    const clips = gltf.animations || [];
    if (!clips.length){ cname.textContent = 'В GLB НЕТ АНИМАЦИИ'; return; }
    playClip(clips[0], name + (clips.length > 1 ? '  (' + clips.length + ' клипов, играет 1-й)' : ''));
    groundAnimatedPose(model, mixer, action, curClip);
  }, undefined, fail);
}

// выбрать пункт слева по url (связь кандидат→каталог)
function selectLeftByUrl(url){
  const rec = byUrl.get(url);
  if (!rec) return false;
  document.querySelectorAll('button.clip').forEach(b => b.classList.remove('act'));
  rec.el.classList.add('act');
  rec.el.scrollIntoView({block:'nearest'});
  return true;
}

// ── Левая панель: сворачиваемые группы + фильтр «N из M» (26.11.26) ────────
// Юзер не мог найти паки UAL в длинном списке Mixamo (2317 клипов) — группы
// сворачиваются, состояние запоминается в localStorage, фильтр сам раскрывает
// группы с совпадениями и показывает «сколько нашлось из сколько есть».
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v === '1'; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v ? '1' : '0'); } catch(e){} },
};
let leftGroups = [];

function buildCatalog(data){
  const box = document.getElementById('catalog');
  box.innerHTML = '';
  leftGroups = [];
  let total = 0;
  data.groups.forEach(g => {
    const collapsed = LS.get('anim.grp.' + g.id, false);
    const head = document.createElement('div');
    head.className = 'grp' + (collapsed ? ' closed' : '');
    head.innerHTML = '<span class="tw">' + (collapsed ? '▸' : '▾') + '</span>' + g.name +
      ' <span class="cnt">(<span class="shown">' + g.items.length + '</span><span class="ofl">/' + g.items.length + '</span>)</span>';
    box.appendChild(head);
    const wrap = document.createElement('div');
    wrap.className = 'grpitems';
    wrap.style.display = collapsed ? 'none' : '';
    box.appendChild(wrap);
    const items = [];
    g.items.forEach(it => {
      const kind = it.url.endsWith('.glb') ? (g.id === 'ual' ? 'glblib' : 'glb')
                 : it.url.endsWith('.fbx') ? 'fbx' : 'none';
      const b = document.createElement('button');
      b.className = 'clip' + (it.preview ? '' : ' no');
      const aka = it.aka || [];
      b.textContent = it.name + (aka.length ? '  ⇄ ' + aka.join(', ') : '');
      // Поиск и по имени файла, и по ИМЕНИ КЛИПА В ИГРЕ: «wings» → Flying.fbx.
      b.dataset.q = (it.name + ' ' + aka.join(' ')).toLowerCase();
      if (aka.length) b.title = 'в игре: ' + aka.join(', ') + '\nфайл: ' + it.name;
      if (it.preview){
        b.onclick = () => { const tok = ++loadTok; selectLeftByUrl(it.url); loadUrl(it.url, it.name, kind, tok); };
      } else {
        b.title = (b.title ? b.title + '\n' : '') + 'нет браузер-превью';
      }
      wrap.appendChild(b);
      items.push({el: b, name: it.name.toLowerCase()});
      byUrl.set(it.url, {el: b, group: g.id});
      total++;
    });
    const rec = {id: g.id, head, wrap, items, total: g.items.length};
    head.querySelector('.ofl').style.display = 'none';  // «/M» — только при поиске
    head.onclick = () => toggleGroup(rec);
    leftGroups.push(rec);
  });
  loadinfo.textContent = 'клипов: ' + total + ' · клик слева или кандидат справа';
}

function toggleGroup(rec){
  const closed = rec.wrap.style.display !== 'none';
  rec.wrap.style.display = closed ? 'none' : '';
  rec.head.classList.toggle('closed', closed);
  rec.head.querySelector('.tw').textContent = closed ? '▸' : '▾';
  LS.set('anim.grp.' + rec.id, closed);
}

function applyFilter(q){
  let hits = 0;
  leftGroups.forEach(rec => {
    let shown = 0;
    rec.items.forEach(it => {
      // Ищем по dataset.q (имя файла + ИМЯ КЛИПА В ИГРЕ), а не по имени файла:
      // «tether_hang» должен находить Hanging_Idle_2.fbx (жалоба юзера 26.11.26).
      const ok = !q || it.el.dataset.q.includes(q);
      it.el.classList.toggle('hidden', !ok);
      if (ok) shown++;
    });
    rec.head.querySelector('.shown').textContent = shown;
    // «N/M» показываем ТОЛЬКО при активном поиске (иначе «2317/2317» = шум).
    rec.head.querySelector('.ofl').style.display = q ? '' : 'none';
    if (q){
      // при поиске группы с совпадениями раскрываем принудительно (не пишем в LS)
      const has = shown > 0;
      rec.head.style.display = has ? '' : 'none';
      rec.wrap.style.display = has ? '' : 'none';
      rec.head.querySelector('.tw').textContent = '▾';
      hits += shown;
    } else {
      rec.head.style.display = '';
      const closed = LS.get('anim.grp.' + rec.id, false);
      rec.wrap.style.display = closed ? 'none' : '';
      rec.head.querySelector('.tw').textContent = closed ? '▸' : '▾';
    }
  });
  loadinfo.textContent = q ? ('найдено ' + hits + ' из ' + leftGroups.reduce((s, r) => s + r.total, 0) + ' клипов')
                           : ('клипов: ' + leftGroups.reduce((s, r) => s + r.total, 0) + ' · клик слева или кандидат справа');
}

// ── Правая панель: карточки «скилл → кандидаты» (26.11.26, переделка UX) ────
// Было «каша»: плоский список кнопок скиллов + div-кандидатов вперемешку.
// Стало: карточка на скилл (сворачиваемая), в шапке — фаза и метка, в мете —
// ЧТО СТОИТ В ИГРЕ (клип из дампа + файл источника + есть ли в библиотеке),
// ниже — вложенный список кандидатов с бейджами «одобрен/есть в библиотеке/
// нет в библиотеке» и путём к файлу. Данные — /anim/api/skills (сервер джойнит
// temp/skills_dump.json ⨝ candidates.json ⨝ temp/anim_library.json ⨝ манифест).
function buildRight(data){
  const skills = data.skills || [];
  const box = document.getElementById('skills');
  box.innerHTML = '';
  box.appendChild(legendEl(data.legend, data.library));

  let phase = '';
  skills.forEach(sk => {
    if ((sk.phase || '') !== phase){
      phase = sk.phase || '';
      if (phase){
        const g = document.createElement('div');
        g.className = 'grp2'; g.textContent = phase;
        box.appendChild(g);
      }
    }
    box.appendChild(skillCard(sk));
  });
  const miss = skills.filter(s => s.current && s.warn).length;
  if (miss){
    const w = document.createElement('div');
    w.className = 'skwarn';
    w.textContent = '⚠ Скиллов с проблемой анимации: ' + miss +
      ' — смотри оранжевые полосы ниже (клип не в библиотеке / не задан).';
    box.appendChild(w);
  }
}

function legendEl(legend, library){
  const d = document.createElement('div');
  d.className = 'legend';
  const lib = library || {};
  d.innerHTML =
    '<b>Статусы кандидатов:</b><br>' +
    '<span class="dot v-ok"></span>одобрен · <span class="dot v-alt"></span>альтернатива · ' +
    '<span class="dot v-warn"></span>проверить зрением · <span class="dot v-no"></span>не годится<br>' +
    '<b>Бейджи клипа:</b> ' +
    '<span class="badge b-game">в игре</span>стоит сейчас · ' +
    '<span class="badge b-lib">в библиотеке</span>играет · ' +
    '<span class="badge b-man">в манифесте</span>есть имя+файл · ' +
    '<span class="badge b-miss">нет в библиотеке</span>не заиграет<br>' +
    '<b>Имя в игре ≠ имя файла:</b> серым в кандидате показан путь к файлу источника ' +
    '(Mixamo-файл против имени клипа манифеста).<br>' +
    '<b>Библиотека:</b> ' + (lib.casts_count || 0) + ' каст-клипов, ' + (lib.loco_count || 0) + ' локо' +
    (lib.generated ? ' · дамп ' + lib.generated.replace('T', ' ') : '') +
    (lib.dump_missing ? '<br>⚠ temp/anim_library.json нет — перезапусти admin\\start_admin.bat' : '');
  return d;
}

function skillCard(sk){
  const card = document.createElement('div');
  card.className = 'skcard';
  const c = sk.current || {};
  const collapsed = LS.get('anim.sk.' + sk.id, false);

  const hd = document.createElement('div');
  hd.className = 'skhd';
  hd.innerHTML = '<span class="tw">' + (collapsed ? '▸' : '▾') + '</span>' +
    '<span class="nm">' + (sk.name || sk.id) + '</span>' +
    '<span class="ph">' + (sk.phase || '') + '</span>';
  card.appendChild(hd);

  const meta = document.createElement('div');
  meta.className = 'skmeta';
  meta.innerHTML = currentLine(c) + '<br>' + paramsLine(c, sk);
  card.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'skbody';
  body.style.display = collapsed ? 'none' : '';
  if (sk.warn) {
    const w = document.createElement('div');
    w.className = 'skwarn';
    w.textContent = '⚠ ' + sk.warn;
    body.appendChild(w);
  }
  const list = sk.cands || [];
  if (!list.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'кандидатов нет — нужен подбор (спроси агента: mixamo_search.py + зрение)';
    body.appendChild(e);
  } else {
    const h = document.createElement('div');
    h.className = 'candhead';
    h.textContent = 'кандидаты (' + list.length + ')';
    body.appendChild(h);
    list.forEach(cd => body.appendChild(candEl(cd)));
  }
  card.appendChild(body);

  const toggle = () => {
    const closed = body.style.display !== 'none';
    body.style.display = closed ? 'none' : '';
    hd.querySelector('.tw').textContent = closed ? '▸' : '▾';
    LS.set('anim.sk.' + sk.id, closed);
  };
  hd.onclick = toggle;
  return card;
}

function currentLine(c){
  if (c.unknown){
    return '<b>в игре:</b> <i>неизвестно — нет дампа игры (перезапусти admin\\start_admin.bat)</i>';
  }
  if (!c.clip){
    return c.channel
      ? '<b>в игре:</b> канал (Cast_Enter→Loop→Shoot) — своего клипа нет'
      : '<b>в игре:</b> <i>анимация не задана</i>';
  }
  const badges = [];
  if (c.in_lib) badges.push('<span class="badge b-lib">в библиотеке</span>');
  else badges.push('<span class="badge b-miss">нет в библиотеке</span>');
  if (c.in_manifest) badges.push('<span class="badge b-man">в манифесте</span>');
  if (c.loop) badges.push('<span class="badge b-man">клип-состояние (по кругу)</span>');
  return '<b>в игре:</b> <span class="badge b-game">' + c.clip + '</span> ' + badges.join('') +
    (c.next_cast_anim
      ? '<br><span class="src">очередь ударов: ' + c.clip + ' → ' + c.next_cast_anim + ' → ' + c.clip + '</span>'
      : '') +
    (c.file ? '<br><span class="src">файл источника: ' + c.file + '</span>'
            : '<br><span class="src">файла источника нет (клип нашей сборки/нейро)</span>');
}

function paramsLine(c, sk){
  const p = [];
  if (c.channel) p.push('канал ' + c.cast_time.toFixed(1) + 'с');
  if (c.stance_loop_anim) p.push('поза стойки: ' + c.stance_loop_anim);
  if (c.cast_hand) p.push('рука ' + (c.cast_hand === 'Left' ? 'левая' : 'правая'));
  if (c.alternate_hands) p.push('чередование рук');
  if (c.cancel_at) p.push('отмена с ' + Math.round(c.cancel_at * 100) + '%');
  if (c.len) p.push('клип ' + c.len + 'с');
  if (sk.branch) p.push('ветка ' + sk.branch);
  return '<span class="src">' + p.join(' · ') + '</span>';
}

function candEl(cd){
  const d = document.createElement('div');
  d.className = 'cand' + (cd.in_lib ? '' : ' miss');
  d.dataset.url = cd.url;
  const badges = [];
  if (cd.approved) badges.push('<span class="badge b-appr">одобрен — стоит в игре</span>');
  if (cd.game_names && cd.game_names.length)
    badges.push('<span class="badge b-man">имя в игре: ' + cd.game_names.join(', ') + '</span>');
  if (cd.in_lib) badges.push('<span class="badge b-lib">в библиотеке</span>');
  else badges.push('<span class="badge b-miss">нет в библиотеке</span>');
  d.innerHTML = '<span class="dot v-' + (cd.v || 'alt') + '"></span>' +
    '<span class="cn">' + cd.clip + '</span>' + badges.join('') +
    '<div class="nt">' + (cd.note || '') + '</div>' +
    '<div class="src">' + (cd.url ? 'файл: ' + cd.url : 'файла-превью нет — клип только в библиотеке') + '</div>';
  d.onclick = (ev) => {
    ev.stopPropagation();
    document.querySelectorAll('.cand').forEach(x => x.classList.remove('sel'));
    d.classList.add('sel');
    const tok = ++loadTok;
    // Пустой url = клип собран в библиотеку, файла-превью нет (src="lib").
    // Раньше такая ссылка строилась в несуществующий .f32 и давала 404.
    if (!cd.url){
      clearModel();
      cname.textContent = cd.clip + '  — превью нет (клип собран в библиотеку)';
      cpath.textContent = 'только в каст-библиотеке';
      return;
    }
    const kind = cd.url.endsWith('.glb') ? 'glb' : 'fbx';
    // 1) выбрать пункт слева; 2) загрузить в центр
    const ok = selectLeftByUrl(cd.url);
    loadUrl(cd.url, cd.clip, kind, tok);
    if (!ok) cpath.textContent = cd.url + '  (нет в каталоге слева)';
  };
  return d;
}

// фильтр слева: считает «N из M», раскрывает группы с совпадениями
document.getElementById('filter').oninput = (e) => {
  applyFilter(e.target.value.trim().toLowerCase());
};

Promise.all([
  fetch('/anim/api/list').then(r => r.json()),
  // Правая панель — ТОЛЬКО серверный джойн (дамп игры ⨝ кандидаты ⨝ библиотека
  // ⨝ манифест). Фолбэк на candidates.json — если API недоступен.
  fetch('/anim/api/skills').then(r => r.json()).catch(() => null),
]).then(([cat, api]) => {
  buildCatalog(cat);
  if (api && api.skills) {
    buildRight(api);
    const first = document.querySelector('.cand');
    if (first) first.click();
  } else {
    loadinfo.textContent = 'API /anim/api/skills недоступен — перезапусти admin\\start_admin.bat';
    fetch('./candidates.json').then(r => r.json()).then(cand => {
      // Аварийный путь: ТОЛЬКО кандидаты, без библиотеки/манифеста.
      // ВАЖНО: «в игре» здесь показать НЕЛЬЗЯ — правда о текущем клипе живёт
      // в дампе игры (temp/skills_dump.json), которого сейчас нет. Раньше здесь
      // подставлялось рукописное поле s.current из candidates.json, и оно врало
      // (wings «Flying не подключён», portals «анимация не нужна» — при том что
      // всё уже стояло). Лучше честно «неизвестно», чем ложный клип.
      buildRight({skills: cand.skills.map(s => ({
        id: s.id, name: s.name, phase: s.phase,
        current: {clip: '', unknown: true, in_lib: false, in_manifest: false, file: ''},
        cands: (s.cands || []).map(c => Object.assign({}, c, {url: candUrlFallback(c), in_lib: false})),
      }))});
    });
  }
}).catch(e => { loadinfo.textContent = 'ошибка загрузки: ' + e; });

// Фолбэк-построение URL (когда серверный API недоступен).
function candUrlFallback(c){
  if (c.src === 'lib') return '';   // клип только в библиотеке, файла-превью нет
  if (c.src === 'glb') return '/tools/candidates_models/' + c.clip + '.glb';
  if (c.src === 'neuro') return '/Graphics/Animations/neuro_soma/' + c.clip + '/' + c.clip + '.f32';
  if (c.src === 'raw') return '/Graphics/Animations/raw/mixamo/' + c.clip + '.fbx';
  return '/Graphics/mixamo-lib/fbx/' + c.clip + '.fbx';
}

document.getElementById('pp').onclick = (e) => {
  playing = !playing;
  e.target.textContent = playing ? '⏸ пауза' : '▶ играть';
  if (action) action.setEffectiveTimeScale(playing ? speed : 0);
};
const spd = document.getElementById('spd');
spd.oninput = () => {
  speed = parseFloat(spd.value);
  document.getElementById('spdv').textContent = speed + '×';
  if (action) action.setEffectiveTimeScale(playing ? speed : 0);
};
document.getElementById('rs').onclick = () => { cam.position.copy(HOME.pos); ctl.target.copy(HOME.tgt); };
cname.onclick = () => navigator.clipboard && navigator.clipboard.writeText(cname.textContent);
cpath.onclick = () => navigator.clipboard && navigator.clipboard.writeText(cpath.textContent);

let last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (mixer) mixer.update(dt);
  if (avatarMixer && !mixer) avatarMixer.update(dt);
  ctl.update();
  renderer.render(scene, cam);
  resize();
}
requestAnimationFrame(tick);
resize();
</script>
