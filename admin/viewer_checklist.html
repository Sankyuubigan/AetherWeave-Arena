<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка игры — админка</title>
<style>
  :root { --bg:#14161c; --card:#1d212b; --edge:#2c3242; --txt:#d8dce6; --dim:#8b92a3;
          --acc:#7fb069; --bad:#e07070; --warn:#e0b45c; --info:#8ecdfc; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 "Segoe UI",system-ui,sans-serif; padding:24px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:22px; }
  .sub { color:var(--dim); margin:4px 0 18px; font-size:13px; }
  .sub a { color:var(--info); text-decoration:none; } .sub a:hover { text-decoration:underline; }
  #top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:14px; }
  #top .right { display:flex; gap:8px; align-items:center; flex-shrink:0; padding-top:4px; }
  button { background:#2a2f3d; color:var(--txt); border:1px solid #3a4152; border-radius:6px;
           padding:6px 14px; cursor:pointer; font-size:14px; font-family:inherit; }
  button:hover { border-color:var(--acc); }
  button.primary { background:#2e5d3f; border-color:#3f7d55; font-weight:600; }
  button.primary:hover { border-color:var(--acc); }
  button.small { padding:2px 10px; font-size:12px; }
  button.okbtn { background:#22392a; border-color:#33513d; color:#b8e0c4; }
  button.okbtn:hover { border-color:var(--acc); background:#2b4a34; }
  input#filter { background:#262b38; color:var(--txt); border:1px solid #3a4152; border-radius:5px;
                 padding:5px 10px; font-size:13px; width:200px; font-family:inherit; }
  input#filter:focus { outline:none; border-color:var(--acc); }
  .counts { display:flex; gap:10px; margin-bottom:16px; }
  .pill { background:#242a37; border-radius:999px; padding:3px 14px; font-size:13px; color:var(--dim); }
  .pill b { color:var(--txt); }
  .pill.pend b { color:var(--warn); } .pill.done b { color:var(--acc); }
  .dayhead { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.6px;
             margin:18px 0 6px; padding-left:2px; }
  .card { background:var(--card); border:1px solid var(--edge); border-radius:10px;
          padding:12px 14px; margin-bottom:10px; transition:border-color .15s, opacity .2s; }
  .card:hover { border-color:#3a4458; }
  .card.decision { border-left:3px solid var(--info); }
  .card .head { display:flex; align-items:flex-start; gap:10px; }
  .dot { width:9px; height:9px; border-radius:50%; margin-top:7px; flex-shrink:0; background:var(--warn); }
  .card.decision .dot { background:var(--info); }
  .card .ttl { flex:1; font-weight:600; font-size:15px; line-height:1.35; }
  .card .ttl .dec { font-weight:400; font-size:11px; color:var(--info); border:1px solid #2e4a63;
                    border-radius:4px; padding:0 6px; margin-left:6px; white-space:nowrap; vertical-align:1px; }
  .card .body { color:#b8bfcc; font-size:13.5px; margin:8px 0 0 19px; }
  .card .body p { margin:6px 0; } .card .body p:first-child { margin-top:0; }
  .card .body ul { margin:6px 0 6px 18px; } .card .body li { margin:2px 0; }
  .card .body code { background:#242a37; border-radius:3px; padding:0 5px; font-size:12.5px; color:#cde3ff; }
  .card .body a { color:var(--info); }
  .card .body b { color:#e6eaf2; }
  .card .body .more { color:var(--acc); cursor:pointer; font-size:12.5px; user-select:none; }
  .card .foot { display:flex; gap:8px; align-items:center; margin:10px 0 0 19px; }
  .card .meta { color:var(--dim); font-size:11.5px; margin-left:auto; }
  .card.hidden { display:none; }
  .card.leaving { opacity:0; transform:translateX(14px); }
  #donewrap { margin-top:26px; border-top:1px solid var(--edge); padding-top:14px; }
  #donewrap h2 { font-size:14px; color:var(--dim); cursor:pointer; user-select:none; font-weight:600; }
  #donewrap h2:hover { color:var(--txt); }
  #donelist { margin-top:10px; }
  #donewrap .card { opacity:.62; } #donewrap .card:hover { opacity:.85; }
  #empty { text-align:center; color:var(--dim); padding:60px 0; font-size:15px; display:none; }
  #empty .big { font-size:38px; margin-bottom:10px; }
  #err { background:#5d2e2e; border-left:3px solid var(--bad); border-radius:6px;
         padding:10px 14px; margin-bottom:14px; display:none; }
  #toast { position:fixed; bottom:22px; right:22px; background:#1d2b1f; border:1px solid var(--acc);
           color:var(--txt); border-radius:8px; padding:12px 18px; display:none; z-index:10; max-width:420px; }
  #toast.err { background:#2b1d1d; border-color:var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <div id="top">
    <div>
      <h1>✅ Проверка игры</h1>
      <div class="sub">Что сделано и ждёт твоего вердикта. Отметил «Проверено» — пункт уходит
        вниз; агент чистит отмеченные в начале сессии.
        <a href="/">← в хаб админки</a></div>
    </div>
    <div class="right">
      <input id="filter" placeholder="Фильтр по тексту…">
      <button id="reload" title="Перечитать файл">↺</button>
      <button id="doneall" class="primary">✅ Всё проверено</button>
    </div>
  </div>
  <div id="err"></div>
  <div class="counts">
    <span class="pill pend">К проверке: <b id="cnt_pend">0</b></span>
    <span class="pill done">Проверено: <b id="cnt_done">0</b></span>
  </div>
  <div id="pending"></div>
  <div id="empty"><div class="big">🎉</div>Список пуст — всё проверено.<br>
    Новые пункты появятся здесь, когда агент закончит следующую работу.</div>
  <div id="donewrap" style="display:none">
    <h2 id="donetoggle"><span id="done_arrow">▸</span> Проверено (<span id="done_n">0</span>)</h2>
    <div id="donelist"></div>
  </div>
</div>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// --- markdown-lite: **жирный**, `код`, [текст](url), переносы строк, списки «- »
function mdInline(s) {
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s;
}
function mdBlock(src) {
  const lines = String(src || '').split(/\r?\n/);
  let html = '', para = [], list = [];
  // ВАЖНО: строки абзаца склеиваем через ПРОБЕЛ и рендерим mdInline на целом
  // абзаце — иначе **жирный**/`код`, разорванные переносом строки (QUEUE.md
  // переносился по 80 симв.), не закрываются и торчат звёздочками/бэктиками.
  const flushP = () => {
    if (para.length) { html += '<p>' + mdInline(para.join(' ')) + '</p>'; para = []; }
  };
  const flushL = () => {
    if (list.length) { html += '<ul>' + list.map(x=>'<li>'+x+'</li>').join('') + '</ul>'; list = []; }
  };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { flushP(); flushL(); continue; }
    const m = line.match(/^\s*[-•]\s+(.*)$/);
    if (m) { flushP(); list.push(mdInline(m[1])); continue; }
    flushL(); para.push(line.trim());
  }
  flushP(); flushL();
  return html;
}

let DATA = null, showDone = false, filter = '';
const COLLAPSE_AT = 700;   // длинные тела сворачиваем

function toast(msg, err=false) {
  const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : '';
  t.style.display = 'block'; clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.style.display='none'; }, err ? 6000 : 3000);
}
function fail(msg) {
  const e = $('err'); e.style.display = 'block';
  e.textContent = '⚠ ' + msg;
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let js = null;
  try { js = await r.json(); } catch (e) { /* не json */ }
  if (!r.ok || !js || js.ok === false) throw new Error((js && js.error) || ('HTTP ' + r.status));
  return js;
}

function matches(it) {
  if (!filter) return true;
  const f = filter.toLowerCase();
  return (it.title + ' ' + it.body + ' ' + it.date).toLowerCase().includes(f);
}

function card(it, isDone) {
  const el = document.createElement('div');
  el.className = 'card' + (it.kind === 'decision' ? ' decision' : '');
  el.dataset.id = it.id;
  const bodyHtml = mdBlock(it.body);
  const long = (it.body || '').length > COLLAPSE_AT;
  const btnLabel = it.kind === 'decision' ? '✅ Решено' : '✅ Проверено';
  el.innerHTML = `
    <div class="head">
      <span class="dot"></span>
      <div class="ttl">${esc(it.title)}${it.kind === 'decision' ? '<span class="dec">нужно решение</span>' : ''}</div>
    </div>
    ${bodyHtml ? `<div class="body">${long ? '<div class="short">' + bodyHtml + '</div><span class="more">Показать полностью ▾</span>' : bodyHtml}</div>` : ''}
    <div class="foot">
      ${isDone ? `<button class="small" data-act="undo">↩ Вернуть</button>`
               : `<button class="okbtn" data-act="done">${btnLabel}</button>`}
      <span class="meta">${isDone && it.done_at ? 'отмечено ' + esc(it.done_at.replace('T',' ')) : ''}</span>
    </div>`;
  if (long) {
    const short = el.querySelector('.short');
    const more = el.querySelector('.more');
    short.style.maxHeight = '150px'; short.style.overflow = 'hidden';
    short.style.maskImage = 'linear-gradient(180deg,#000 55%,transparent)';
    short.style.webkitMaskImage = 'linear-gradient(180deg,#000 55%,transparent)';
    more.onclick = () => {
      const open = short.style.maxHeight === 'none';
      short.style.maxHeight = open ? '150px' : 'none';
      short.style.maskImage = open ? 'linear-gradient(180deg,#000 55%,transparent)' : 'none';
      short.style.webkitMaskImage = short.style.maskImage;
      more.textContent = open ? 'Показать полностью ▾' : 'Свернуть ▴';
    };
  }
  const btn = el.querySelector('button[data-act]');
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      if (isDone) await api('POST', '/checklist/api/undo', { id: it.id });
      else await api('POST', '/checklist/api/done', { id: it.id });
      toast(isDone ? 'Возвращено в список' : 'Отмечено проверенным');
      await load();
    } catch (e) {
      btn.disabled = false;
      toast('Ошибка: ' + e.message, true);
    }
  };
  return el;
}

function render() {
  const pend = DATA.items.filter(x => x.status === 'pending');
  const done = DATA.items.filter(x => x.status === 'done');
  $('cnt_pend').textContent = pend.length;
  $('cnt_done').textContent = done.length;
  $('done_n').textContent = done.length;

  // --- ожидающие: группы по дате (свежие даты СВЕРХУ, внутри группы — порядок файла)
  const box = $('pending'); box.innerHTML = '';
  const shown = pend.filter(matches);
  const dateKey = d => {
    const m = /^(\d{2})\.(\d{2})\.(\d{2})$/.exec(d || '');
    return m ? (2000 + +m[3]) * 10000 + (+m[2]) * 100 + (+m[1]) : 0;  // ДД.ММ.ГГ → YYYYMMDD
  };
  const groups = new Map();
  for (const it of shown) {
    const d = it.date || '';
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(it);
  }
  const order = [...groups.keys()].sort((a, b) => dateKey(b) - dateKey(a));  // свежие первыми, «без даты» в конце
  for (const d of order) {
    const h = document.createElement('div');
    h.className = 'dayhead';
    h.textContent = d || 'без даты';
    box.appendChild(h);
    for (const it of groups.get(d)) box.appendChild(card(it, false));
  }
  $('empty').style.display = (pend.length === 0) ? 'block' : 'none';
  if (shown.length === 0 && pend.length > 0) {
    const h = document.createElement('div');
    h.className = 'dayhead'; h.textContent = 'ничего не найдено по фильтру';
    box.appendChild(h);
  }

  // --- проверенные (свёрнутый блок)
  $('donewrap').style.display = done.length ? 'block' : 'none';
  const dl = $('donelist'); dl.innerHTML = '';
  dl.style.display = showDone ? 'block' : 'none';
  $('done_arrow').textContent = showDone ? '▾' : '▸';  // стрелку меняем ТОЛЬКО в своём span:
  // перезапись textContent заголовка стирала бы #done_n (баг «Cannot set properties of null»)
  if (showDone) {
    for (const it of done.filter(matches)) dl.appendChild(card(it, true));
  }
}

async function load() {
  $('err').style.display = 'none';
  try {
    DATA = await api('GET', '/checklist/api/list');
    render();
  } catch (e) {
    fail('Не удалось прочитать чек-лист: ' + e.message);
  }
}

$('reload').onclick = load;
$('filter').oninput = e => { filter = e.target.value.trim(); render(); };
$('donetoggle').onclick = () => { showDone = !showDone; render(); };
$('doneall').onclick = async () => {
  const n = DATA ? DATA.items.filter(x => x.status === 'pending').length : 0;
  if (!n) { toast('Нечего отмечать'); return; }
  if (!confirm('Отметить проверенными все ' + n + ' пунктов?')) return;
  try {
    const js = await api('POST', '/checklist/api/done_all', {});
    toast('Отмечено: ' + js.changed);
    await load();
  } catch (e) { toast('Ошибка: ' + e.message, true); }
};
load();
</script>
</body>
</html>
